services:
  app:
    build:
      context: .
      platforms:
        - "linux/amd64"
    container_name: visothap-v2
    restart: unless-stopped
    image: hackapp8/visothap-v2
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3